name: handoff-check

# A Change request or problem report must name a real stream/process/step from docs/models/processes.yaml.
on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

jobs:
  process-step:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: python -m pip install --quiet pyyaml==6.0.3
      - id: check
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python ci/check_handoff.py
      - name: flag an unknown process step
        if: steps.check.outputs.result == 'invalid'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          STEP: ${{ steps.check.outputs.step }}
          ALREADY: ${{ contains(github.event.issue.labels.*.name, 'needs-process-step') }}
        run: |
          gh label create needs-process-step --color D93F0B --description "Process step not found in the process map" --force
          if [ "$ALREADY" != "true" ]; then
            gh issue edit "$NUMBER" --add-label needs-process-step
            printf 'The process step `%s` is not in [`docs/models/processes.yaml`](../blob/main/docs/models/processes.yaml). Use `stream/process/step`, for example `o2c/quote/create`, then edit the issue.\n' "$STEP" > comment.md
            gh issue comment "$NUMBER" --body-file comment.md
          fi
      - name: clear the flag once fixed
        if: steps.check.outputs.result == 'valid' && contains(github.event.issue.labels.*.name, 'needs-process-step')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        run: gh issue edit "$NUMBER" --remove-label needs-process-step
