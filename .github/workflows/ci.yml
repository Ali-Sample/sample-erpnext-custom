name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: python -m pip install --quiet ruff==0.16.10 pyyaml==6.0.3
      - name: lint
        run: ruff check .
      - name: process map
        run: python ci/check_process_map.py docs/models/processes.yaml
      - name: hand-off check self-test
        run: python ci/check_handoff.py --demo

  fresh-site:
    name: fresh-site
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: build image
        run: docker build -f Containerfile -t "sample-erpnext-custom:${GITHUB_SHA}" .
      - name: fresh site, install, run tests
        run: ci/fresh-site-test.sh "sample-erpnext-custom:${GITHUB_SHA}"
